# nginx для статического сайта kendo-baikal.ru.
# Образ nginxinc/nginx-unprivileged: работает не от root, слушает 8080, поэтому
# pid и временные каталоги вынесены в /tmp (в compose это tmpfs, корень — read-only).
worker_processes  1;
pid        /tmp/nginx.pid;
error_log  /dev/stderr warn;

events {
    worker_connections  512;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    charset       utf-8;
    server_tokens off;

    access_log  /dev/stdout;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    sendfile    on;
    tcp_nopush  on;
    keepalive_timeout 30s;

    # Редиректы старых URL: генерируется при сборке образа (scripts/gen-nginx-redirects.mjs).
    # Ключи map — $request_uri целиком (с query), поэтому корзины хэша увеличены.
    map_hash_max_size    8192;
    map_hash_bucket_size 256;
    include /etc/nginx/redirects.map.conf;

    # Brotli не включён: в штатном образе nginx его нет, а ставить сторонний модуль — лишняя зависимость.
    gzip            on;
    gzip_vary       on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied    any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript
               application/json application/xml application/rss+xml application/atom+xml
               application/manifest+json image/svg+xml font/ttf font/otf;

    server {
        listen 8080 default_server;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # За Traefik: Location без схемы/хоста (иначе уйдёт http://...:8080).
        absolute_redirect off;
        port_in_redirect  off;

        # Только чтение: статика.
        if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
            return 405;
        }

        # Старые URL WordPress → 301 (см. redirects.csv).
        # (по одной переменной на статус: `return` принимает только литеральный код)
        if ($redirect_301 != "") { return 301 $redirect_301; }
        if ($redirect_302 != "") { return 302 $redirect_302; }
        if ($redirect_307 != "") { return 307 $redirect_307; }
        if ($redirect_308 != "") { return 308 $redirect_308; }

        # Заголовки безопасности. ВАЖНО: add_header в location отменяет унаследованные,
        # поэтому в location ниже add_header не используется (кеш — через expires),
        # а /admin/ задаёт полный набор сам.
        # CSP сайта: только свои ресурсы. Если появятся внешние скрипты/картинки/встраивания
        # (карты и т.п.) — расширить здесь осознанно. Встраивания видео: YouTube и VK (frame-src).
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval'; font-src 'self' data:; connect-src 'self'; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://vk.com https://*.vk.com https://*.vkvideo.ru; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;

        error_page 404 /404.html;
        location = /404.html { internal; expires 5m; }

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Никаких скрытых файлов.
        location ~ /\. { return 404; }

        # Хэшированные ассеты Astro — неизменяемые.
        location /_astro/ {
            expires 1y;
            try_files $uri =404;
        }

        # Загрузки редакторов: имена не хэшируются, поэтому 30 дней, а не год.
        location /uploads/ {
            expires 30d;
            try_files $uri =404;
        }

        # Админка (Sveltia CMS). Свой CSP: скрипты/локали с unpkg (версия закреплена + SRI),
        # API GitHub для чтения/записи контента, картинки с GitHub и blob: для превью.
        location /admin/ {
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://unpkg.com 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: blob: https://avatars.githubusercontent.com https://raw.githubusercontent.com https://*.githubusercontent.com https://unpkg.com; font-src 'self' data: https://unpkg.com; connect-src 'self' https://api.github.com https://github.com https://unpkg.com https://www.githubstatus.com https://raw.githubusercontent.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self' https://github.com; frame-ancestors 'none'" always;
            add_header X-Robots-Tag "noindex, nofollow" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "same-origin" always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header Cache-Control "no-store" always;
            try_files $uri $uri/ =404;
        }

        # Sveltia ждёт YAML с корректным типом.
        location = /admin/config.yml {
            default_type text/yaml;
            add_header X-Robots-Tag "noindex, nofollow" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cache-Control "no-store" always;
            try_files $uri =404;
        }

        # Всё остальное: trailingSlash "always". /x → 301 /x/ (nginx добавит слэш сам
        # для существующего каталога), /x/ → /x/index.html. HTML — короткий кеш.
        location / {
            expires 5m;
            try_files $uri $uri/ =404;
        }
    }
}
